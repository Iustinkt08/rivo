# Local infrastructure for NAVIRA development.
# Redis backs the slot-lock layer (SlotLockService) used during booking checkout.
#
# Usage:
#   docker compose up -d          # REDIS_PASSWORD is read from the root .env
#   docker compose logs -f redis
#
# Security posture (dev):
#   - Port published ONLY on 127.0.0.1 — Redis is never reachable from the LAN.
#   - requirepass enforced (defense in depth on top of the localhost bind).
#   - noeviction: slot locks must expire via TTL, never get evicted silently.
services:
  redis:
    image: redis:8-alpine
    container_name: navira-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    environment:
      # Exposed inside the container so the healthcheck can authenticate.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
